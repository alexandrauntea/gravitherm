[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitherm"
version = "0.1.0"
description = "GraviTherm - prototip TechChallenge by Honeywell 2026"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
